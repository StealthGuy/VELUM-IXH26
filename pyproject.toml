[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velum"
version = "0.1.0"
description = "Verifiable multi-level redaction of authority-signed images, anchored on the XRP Ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xrpl-py==5.2.0",
    "dilithium-py==1.5.1",
]

[project.scripts]
velum = "velum.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["dilithium_py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
